version: '2'

linters:
  enable:
    - durationcheck
    - errcheck
    - exportloopref
    - forcetypeassert
    - gosimple
    - ineffassign
    - makezero
    - misspell
    - nilerr
    - predeclared
    - staticcheck
    - tenv
    - unconvert
    - unparam
    - unused
    - govet

formatters:
  enable:
    - gofmt 
