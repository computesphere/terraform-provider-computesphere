name: Checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # PR gate: compile every package + test file and run any unit tests. Acceptance
  # tests (resource.Test) auto-skip without TF_ACC, so this is green without live
  # infra while still catching compile/vet regressions across the provider.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.7'
      - name: Run tests
        run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.7'
      - name: GoLang Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.3.0
      - name: vet
        run: go vet ./...
      - name: lint
        run: golangci-lint run --timeout 10m
        env:
          GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

  # Acceptance tests hit a live API (or replay recorded go-vcr cassettes) and are
  # run on demand, not on every PR. setup-terraform installs the Terraform CLI so
  # the suite does not download+verify it at runtime (which fails on expired
  # HashiCorp release-signing keys). Requires the cassettes to be recorded first.
  acceptance:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.7'
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Run acceptance tests
        run: TF_ACC=1 go test ./... -timeout 30m
